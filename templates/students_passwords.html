{% extends "base.html" %}

{% block title %}Пароли учеников{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto py-10 px-4">
    <div class="bg-white border-4 border-black p-6 shadow-hard mb-10 flex flex-col md:flex-row justify-between items-center gap-6">
        <h2 class="text-3xl font-black uppercase tracking-tighter">Ключи доступа</h2>
        <form method="GET" class="flex gap-2">
            <select name="class" onchange="this.form.submit()" class="border-4 border-black p-2 font-black uppercase focus:bg-neo-yellow outline-none bg-white shadow-hard-hover">
                <option value="">Все классы</option>
                {% for class_ in classes %}
                    <option value="{{ class_ }}" {% if class_ == current_class %}selected{% endif %}>{{ class_ }}</option>
                {% endfor %}
            </select>
        </form>
    </div>

    <div class="bg-white border-4 border-black shadow-hard overflow-x-auto">
        <table class="w-full text-left font-mono">
            <thead>
                <tr class="bg-neo-black text-white border-b-4 border-black">
                    <th class="p-4 uppercase">Ученик</th>
                    <th class="p-4 uppercase">Класс</th>
                    <th class="p-4 uppercase">Логин</th>
                    <th class="p-4 uppercase text-center">Пароль</th>
                </tr>
            </thead>
            <tbody>
                {% for student in students %}
                <tr class="border-b-2 border-black hover:bg-neo-green/10 transition-colors">
                    <td class="p-4 font-bold uppercase">{{ student.fio }}</td>
                    <td class="p-4"><span class="bg-neo-yellow px-2 border border-black">{{ student.class_ }}</span></td>
                    <td class="p-4 font-bold">{{ student.username }}</td>
                    <td class="p-4 text-center">
                        <span class="pass-val bg-black text-black px-2 hover:bg-transparent hover:text-black transition-all cursor-help border border-black"
                              title="Нажмите, чтобы увидеть"
                              onclick="this.classList.toggle('bg-black'); this.classList.toggle('text-black')">
                            {{ student.password }}
                        </span>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
