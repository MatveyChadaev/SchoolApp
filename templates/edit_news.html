{% extends "base.html" %}
{% block title %}Редактирование новости{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto py-12 px-4">
    <div class="bg-white border-4 border-black p-8 shadow-hard relative">
        <div class="absolute -top-6 -right-6 bg-neo-pink text-white p-4 border-4 border-black transform rotate-12 font-black">EDIT</div>
        <h2 class="text-3xl font-black uppercase mb-8 border-b-4 border-black pb-2">Редактировать</h2>

        <form method="POST" class="space-y-6">
            <input type="text" name="title" value="{{ news.title }}" required class="w-full border-4 border-black p-4 font-bold text-xl focus:bg-neo-yellow outline-none shadow-hard-hover">
            <textarea name="content" rows="10" required class="w-full border-4 border-black p-4 font-mono focus:bg-neo-yellow outline-none">{{ news.content }}</textarea>

            <div class="flex gap-4">
                <button type="submit" class="flex-1 bg-neo-green border-4 border-black py-4 font-black uppercase shadow-hard hover:shadow-none transition-all">Сохранить</button>
                <a href="{{ url_for('admin_news') }}" class="flex-1 bg-white border-4 border-black py-4 font-black uppercase text-center shadow-hard hover:shadow-none transition-all">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
