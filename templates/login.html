{% extends "base.html" %}

{% block title %}Вход в систему{% endblock %}

{% block content %}
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: { 'neo-yellow': '#FFDE59', 'neo-purple': '#A663CC', 'neo-green': '#00F5D4', 'neo-pink': '#FF6B6B', 'neo-black': '#1a1a1a' },
                boxShadow: { 'hard': '5px 5px 0px 0px #000000', 'hard-hover': '2px 2px 0px 0px #000000' }
            }
        }
    }
</script>

<div class="min-h-[80vh] flex items-center justify-center p-4 bg-gray-50 bg-[radial-gradient(#000_1px,transparent_1px)] [background-size:20px_20px]">
    <div class="w-full max-w-md bg-white border-4 border-black shadow-hard p-8 md:p-10 rounded-none md:rounded-3xl relative">
        <div class="absolute top-4 left-4 w-3 h-3 border-2 border-black bg-white rounded-full"></div>
        <div class="absolute top-4 right-4 w-3 h-3 border-2 border-black bg-white rounded-full"></div>
        <div class="absolute bottom-4 left-4 w-3 h-3 border-2 border-black bg-white rounded-full"></div>
        <div class="absolute bottom-4 right-4 w-3 h-3 border-2 border-black bg-white rounded-full"></div>

        <div class="text-center mb-8">
            <div class="inline-block bg-neo-yellow border-2 border-black px-4 py-1 font-mono font-bold text-sm mb-4 -rotate-2 shadow-sm">
                ⚠ RESTRICTED AREA
            </div>
            <h2 class="text-4xl font-black uppercase tracking-tighter transform scale-y-110">Вход</h2>
        </div>

        <form method="POST" action="{{ url_for('login') }}" class="space-y-6">
            <div class="form-group">
                <label for="username" class="block font-black text-sm uppercase mb-2 ml-1">Имя пользователя</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 w-12 bg-black flex items-center justify-center text-white border-y-2 border-l-2 border-black rounded-l-lg group-focus-within:bg-neo-purple transition-colors">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <input type="text" id="username" name="username" required
                           class="w-full pl-14 pr-4 py-3 bg-gray-50 border-2 border-black rounded-lg focus:outline-none focus:shadow-hard focus:-translate-y-1 transition-all font-mono font-bold placeholder-gray-400"
                           placeholder="ivanov_ii">
                </div>
            </div>
            <div class="form-group">
                <label for="password" class="block font-black text-sm uppercase mb-2 ml-1">Пароль</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 w-12 bg-black flex items-center justify-center text-white border-y-2 border-l-2 border-black rounded-l-lg group-focus-within:bg-neo-purple transition-colors">
                        <i class="fa-solid fa-key"></i>
                    </div>
                    <input type="password" id="password" name="password" required
                           class="w-full pl-14 pr-4 py-3 bg-gray-50 border-2 border-black rounded-lg focus:outline-none focus:shadow-hard focus:-translate-y-1 transition-all font-mono font-bold placeholder-gray-400"
                           placeholder="••••••••">
                </div>
            </div>
            <button type="submit" class="w-full bg-neo-black text-white font-black uppercase py-4 rounded-lg border-2 border-transparent hover:bg-neo-green hover:text-black hover:border-black hover:shadow-hard hover:-translate-y-1 active:shadow-none active:translate-y-0 transition-all text-xl tracking-widest mt-4">Войти в систему
            </button>
        </form>

        <div class="mt-8 pt-6 border-t-2 border-dashed border-gray-300 text-center">
            <a href="#" class="inline-block px-2 py-1 text-sm font-mono text-gray-500 hover:text-black hover:bg-neo-pink hover:border-black hover:border border border-transparent transition-all transform hover:-rotate-1">
                Забыли пароль?
            </a>
        </div>
    </div>
</div>
{% endblock %}
